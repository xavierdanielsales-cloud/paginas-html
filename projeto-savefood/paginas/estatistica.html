<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estatísticas de Vendas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estatistica.css">
</head>
<body>

    <div class="app-container">
        <header class="header">
            <button class="back-btn" id="backBtn">
                <a href="perfildousuario.html">
                    <i class="fa-solid fa-chevron-left"></i> 
                </a>
                </button>
            <h1 class="header-title">Estatísticas</h1>
        </header>

        <main class="content">
            <h2 class="report-title">Relatório de vendas e reservas</h2>

            <div class="chart-legend">
                <div class="legend-item">
                    <span class="legend-color color-teal"></span>
                    <span class="legend-text">Metas Atingidas</span>
                </div>
            </div>

            <div class="chart-wrapper">
                
                <div class="axis-y">
                    <span>100%</span>
                    <span>80%</span>
                    <span>60%</span>
                    <span>40%</span>
                    <span>20%</span>
                    <span>0%</span>
                </div>

                <div class="chart-area">
                    <div class="grid-lines">
                        <div class="grid-line"></div>
                        <div class="grid-line"></div>
                        <div class="grid-line"></div>
                        <div class="grid-line"></div>
                        <div class="grid-line"></div>
                        <div class="grid-line"></div>
                    </div>

                    <div class="bars-container">
                        <div class="chart-column">
                            <div class="bar bar-teal" style="height: 74%;"></div>
                            <span class="year-label">2013</span>
                        </div>
                        <div class="chart-column">
                            <div class="bar bar-dark-green" style="height: 62%;"></div>
                            <span class="year-label">2014</span>
                        </div>
                        <div class="chart-column">
                            <div class="bar bar-green" style="height: 100%;"></div>
                            <span class="year-label">2015</span>
                        </div>
                        <div class="chart-column">
                            <div class="bar bar-light-green" style="height: 96%;"></div>
                            <span class="year-label">2016</span>
                        </div>
                        <div class="chart-column">
                            <div class="bar bar-yellow" style="height: 77%;"></div>
                            <span class="year-label">2017</span>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>
    
    <script src="estatistica.js"></script>
</body>
</html>
