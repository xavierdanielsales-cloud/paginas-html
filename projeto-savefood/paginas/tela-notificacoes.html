<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tela-notificacoes.css">  
    <title>Tela de Notificações</title>
    <script src="https://kit.fontawesome.com/19d9bf0fc2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
</head>
<body>

    <div class="phone">
        <h2>
            <a id="btnVoltar" class="btn-voltar">
                <i class="fa-solid fa-chevron-left"></i>
            </a> 
            Notificações
        </h2>

        <div id="listaNotificacoes">
            <div class="card-notificacao">
                <a href="tela-notificacoes2.html">
                    <strong>Produtos Próximos:</strong>
                    <p>Produtos próximos de você.</p>
                    <span class="badge">1</span>
                </a>                    
            </div>

            <div class="card-notificacao">
                <a href="#">
                    <strong>Reservas e Alertas:</strong>
                    <p>Alertas de reservas feitas por você</p>
                    <span class="badge">2</span>
                </a>
            </div>

            <div class="card-notificacao">
                <a href="#">
                    <strong>Reservas Feitas:</strong>
                    <p>A sua reserva foi feita com sucesso.</p>
                    <span class="badge">2</span>
                </a>
            </div>
        </div>
    </div>

    <script src="tela-notificacoes.js"></script>
</body>
</html>
