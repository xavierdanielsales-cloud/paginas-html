<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <link rel="stylesheet" href="tela2.css">

    <script src="https://kit.fontawesome.com/19d9bf0fc2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <a href="teladeLogin.html" class="btn-voltar">
             <i class="fa-solid fa-chevron-left"></i>
           </a>
        <h1>Cadastro</h1>
        
        <form>
            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="CPF">CPF (Consumidor):</label>
                    <input type="text" id="CPF" name="CPF">
                </div>
                <div class="form-group">
                    <label for="CNPJ">CNPJ (Estabelecimento):</label>
                    <input type="text" id="CNPJ" name="CNPJ">
                </div>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmar-senha">Confirmar Senha:</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" required>
                </div>
            </div>
            <div class="conteiner-checkbox">
        <input type="checkbox" id="verSenha" class="lado">
        <label for="verSenha">Mostrar senhas</label>
    </div>

            <div class="form-group">
                <label for="perfil">Perfil:</label>
                <select id="perfil" name="perfil" required>
                    <option value="">Selecione o tipo do seu perfil</option>
                    <option value="CONSUMIDOR">Consumidor</option>
                    <option value="ESTABELECIMENTO">Estabelecimento</option>
                </select>
            </div>

            <button href="endereco.html" type="submit" class="button1">Enviar</button>
        </form>
    </div>
    <script src="tela2.js"></script>
</body>
    

</html>
