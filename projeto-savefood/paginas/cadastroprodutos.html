<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="cadastroprodutos.css">
  <title>Cadastro de Produto</title>
  <script src="https://kit.fontawesome.com/19d9bf0fc2.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
</head>
<body>

  <div class="phone">
    <a href="" class="btn-voltar">
      <i class="fa-solid fa-chevron-left"></i>
    </a>

    <form id="formCadastro">
      <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <div class="upload-conteudo">
          <div class="icon"><i class="fa-solid fa-camera"></i></div>
          <p>Adicionar foto do Produto</p>
        </div>
        <img id="previewFoto" src="" alt="Antevisão da foto" style="display: none;">
      </div>
      <input type="file" id="fileInput" accept="image/*" hidden>

      <div class="cadastro">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" placeholder="leite" required>
        </div>
        
        <div class="form-group">
          <label for="categoria">Categoria:</label>
          <input type="text" id="categoria" placeholder="laticinios" required>
        </div>

        <div class="form-group">
                <label for="qtd-produto">Quantidade Disponível</label>
                <input type="number" id="qtd-produto" placeholder="Ex: 20" min="1" required>
            </div>
        <div class="form-group">
                    <label for="validade-produto">Validade</label>
                    <input type="date" id="validade-produto" required>
                </div>
        <div class="form-group">
          <label for="preco-produto">Preço</label>
                    <input type="text" id="preco-produto" placeholder="R$ 0,00" required>
                </div>
      </div>

      <div id="erro" class="error-message"></div>

      <button type="submit" class="btn">
        Confirmar
      </button>
    </form>
  </div>

  <script src="cadastroprodutos.js"></script>
</body>
</html>
