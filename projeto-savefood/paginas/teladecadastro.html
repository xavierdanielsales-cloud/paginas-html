<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Meus Dados</title>
  <link rel="stylesheet" href="teladecadastro.css">
 
  <script src="https://kit.fontawesome.com/19d9bf0fc2.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&display=swap" rel="stylesheet">
</head>
<body>

  <form class="container">
    <div class="topo">
      <div class="btn">
        <a href="perfildousuario.html">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
      </div>
      <h1>Meus Dados</h1>
    </div>

    <div class="form">
      <label>Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label>Telefone:</label>
      <input type="tel" id="telefone" name="telefone" required>

      <label>Endereço:</label>
      <input type="text"  id="endereco" name="endereco" required>
    </div>

    <div class="acoes">
      <button class="btn-editar">editar dados</button>
      
      <span class="excluir">Excluir Conta</span>
    </div>
  </form>

  <script src="teladecadastro.js"></script>
</body>
</html>
